[package]
name = "livetranslate"
version = "0.5.1"
description = "A Tauri App"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "livetranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api backs the transparent overlay on macOS (tauri.conf.json
# `app.macOSPrivateApi`); it must be on the base dep — tauri-build fails any
# platform's plain `cargo build` when the config flag is set without it.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ringbuf = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
# Local current-thread runtime for net::download's async client (only the
# async reqwest ClientBuilder exposes read_timeout stall detection).
tokio = { version = "1", features = ["rt"] }
webrtc-vad = "0.4"
rubato = "0.15"
hound = "3"
tauri-plugin-global-shortcut = "2"
sha2 = "0.10"

# CPU-only (tinyBLAS) on Windows/Linux; Metal is enabled for macOS below.
# Vulkan/dynamic-backends are deliberately deferred — building them needs the
# Vulkan SDK, and CPU tinyBLAS is our floor for native STT (mirrors how Handy
# ships transcribe-cpp).
[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.1.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.1.2", default-features = false, features = ["metal"] }

