<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1502e"/>
      <stop offset="100%" stop-color="#20457e"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Waveform bars — 5 bars, symmetric, rounded caps, vertically centered -->
  <rect x="136" y="251" width="36" height="100" rx="18" fill="url(#bars)"/>
  <rect x="192" y="203" width="36" height="148" rx="18" fill="url(#bars)"/>
  <rect x="248" y="161" width="36" height="190" rx="18" fill="url(#bars)"/>
  <rect x="304" y="203" width="36" height="148" rx="18" fill="url(#bars)"/>
  <rect x="360" y="251" width="36" height="100" rx="18" fill="url(#bars)"/>

</svg>
