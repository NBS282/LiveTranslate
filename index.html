<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main>
      <h1>LiveTranslate — Audio Passthrough</h1>
      <label for="device">Virtual output device:</label>
      <select id="device"></select>
      <button id="toggle">Start</button>
      <p id="status">Stopped</p>
      <hr />
      <section>
        <h2>Offline translation test</h2>
        <button id="pick">Choose Spanish audio…</button>
        <span id="chosen">No file</span>
        <button id="translate" disabled>Translate</button>
        <p id="tr-status"></p>
        <audio id="player" controls></audio>
        <pre id="tr-text"></pre>
      </section>
      <script type="module" src="/src/translate.ts"></script>
      <hr />
      <section>
        <h2>Live translation</h2>
        <label for="live-device">Input mic:</label>
        <select id="live-device"></select>
        <label for="live-output-device">Output (cable):</label>
        <select id="live-output-device"></select>
        <button id="live-toggle">Listen</button>
        <p id="live-status">Idle</p>
        <ul id="phrases"></ul>
      </section>
      <script type="module" src="/src/live.ts"></script>
    </main>
  </body>
</html>
